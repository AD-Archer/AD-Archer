# GitGuardian configuration file
# See https://docs.gitguardian.com/ggshield/configuration/

# Default configuration
default:
  # Enable GitGuardian scanning
  enabled: true

  # Scan patterns
  scan:
    # Scan staged files
    staged: true

    # Scan all files in the repository
    all: false

    # Scan specific paths
    paths:
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.yml'
      - '**/*.env*'
      - '**/*.md'

  # Ignore patterns
  ignore:
    - 'node_modules/**'
    - '.next/**'
    - 'dist/**'
    - 'build/**'
    - 'coverage/**'
