name: CI

on:
  pull_request:
    branches:
      - production

jobs:
  lint-build-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

      - name: Run type-check
        run: pnpm run type-check

      - name: Build application
        run: pnpm run build
