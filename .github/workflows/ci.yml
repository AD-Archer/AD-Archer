name: CI

on:
  pull_request:
    branches:
      - production

jobs:
  lint-build-typecheck:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest 

      - name: Setup Node.js
        uses: actions/setup-node@v4 
        with:
          node-version: '18' 
          cache: 'pnpm' 

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        run: pnpm run lint

      - name: Run type-check
        run: pnpm run type-check

      - name: Build application
        run: pnpm run build
